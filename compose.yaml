services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: Tramontina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Tramontina"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
